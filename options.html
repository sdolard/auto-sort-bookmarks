<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Options - DeepSeek Bookmark Organizer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input[type="password"], textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 5px; box-sizing: border-box; }
    textarea { height: 100px; font-family: monospace; }
    button { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin-top: 15px; }
    button:hover { background-color: #45a049; }
    #status { margin-top: 10px; color: green; font-size: 0.9em; }
    .help { font-size: 12px; color: #666; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2>Configuration de l'Extension</h2>
  
  <label for="apiKey">Clé API DeepSeek :</label>
  <input type="password" id="apiKey" placeholder="sk-..." />
  <div class="help">Nécessaire pour l'analyse par l'IA.</div>

  <label for="overrides">Surcharges / Règles Manuelles (Optionnel) :</label>
  <div class="help">Forcez des thématiques par mots-clés. Format : <code>mot-clé = Thème</code> (un par ligne).<br>Exemple : <code>github.com = Développement</code></div>
  <textarea id="overrides" placeholder="youtube.com = Vidéos&#10;amazon = Shopping"></textarea>

  <button id="saveBtn">Enregistrer les paramètres</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
