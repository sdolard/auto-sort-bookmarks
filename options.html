<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="optionsTitle">Options - AI Bookmark Organizer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input[type="password"], textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 5px; box-sizing: border-box; }
    textarea { height: 100px; font-family: monospace; }
    button { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin-top: 15px; }
    button:hover { background-color: #45a049; }
    #status { margin-top: 10px; color: green; font-size: 0.9em; }
    .help { font-size: 12px; color: #666; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2 data-i18n="optionsTitle">Configuration de l'Extension</h2>
  
  <label for="apiKey" data-i18n="apiKeyLabel">Clé API DeepSeek :</label>
  <input type="password" id="apiKey" placeholder="sk-..." />
  <div class="help" data-i18n="apiKeyHelp">Nécessaire pour l'analyse par l'IA.</div>

  <label for="topCount" data-i18n="topCountLabel">Garder les favoris les plus visités dans la Barre :</label>
  <input type="number" id="topCount" value="10" min="0" max="50" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;" />
  <div class="help" data-i18n="topCountHelp">Les X favoris les plus cliqués seront placés directement sur la barre de favoris. Mettez 0 pour désactiver.</div>

  <label for="overrides" data-i18n="overridesLabel">Surcharges / Règles Manuelles (Optionnel) :</label>
  <div class="help" data-i18n="overridesHelp"></div>
  <textarea id="overrides" data-i18n="overridesPlaceholder" placeholder="youtube.com = Vidéos&#10;amazon = Shopping&#10;mon-site.fr = PIN"></textarea>

  <button id="saveBtn" data-i18n="saveBtn">Enregistrer les paramètres</button>
  <button id="saveAndSortBtn" style="background-color: #2196F3; margin-left: 10px;" data-i18n="saveAndSortBtn">Enregistrer & Lancer l'aperçu</button>
  <div id="status"></div>
  <script src="options.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
