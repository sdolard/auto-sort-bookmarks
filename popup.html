<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Bookmark Organizer</title>
  <style>
    body { font-family: Arial, sans-serif; width: 300px; padding: 15px; text-align: center; }
    button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 5px; width: 100%; margin-bottom: 10px;}
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { font-size: 13px; color: #555; margin-top: 10px; word-wrap: break-word;}
  </style>
</head>
<body>
  <h3>Trieur de Favoris IA</h3>
  <p style="font-size: 12px; color: #666;">Organise vos favoris en thématiques intelligentes avec DeepSeek.</p>
  <button id="sortBtn">Lancer le tri automatique</button>
  <button id="optionsBtn" style="background-color: #6c757d;">Configurer la clé API</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
