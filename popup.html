<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="extName">AI Bookmark Organizer</title>
  <style>
    body { font-family: Arial, sans-serif; width: 320px; padding: 15px; text-align: center; }
    button { color: white; border: none; padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 5px; width: 100%; margin-bottom: 10px;}
    button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
    #sortBtn { background-color: #007bff; }
    #sortBtn:hover { background-color: #0056b3; }
    #forceBtn { background-color: #dc3545; }
    #forceBtn:hover { background-color: #c82333; }
    #optionsBtn { background-color: #6c757d; }
    #optionsBtn:hover { background-color: #5a6268; }
    #status { font-size: 13px; color: #555; margin-top: 10px; word-wrap: break-word;}
    .desc { font-size: 11px; color: #666; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h3 data-i18n="extName">AI Bookmark Organizer</h3>
  
  <button id="sortBtn" data-i18n="popupSortBtn">Générer un aperçu du tri</button>
  <div class="desc" data-i18n="popupSortDesc">Ne déplace rien. Ouvre une page pour vérifier les propositions. Utilise le cache.</div>
  
  <button id="forceBtn" data-i18n="popupForceBtn">Forcer l'analyse (Ignorer le cache)</button>
  <div class="desc" data-i18n="popupForceDesc">Ignore le cache existant pour proposer un nouveau tri de tous les favoris.</div>
  
  <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
  
  <button id="optionsBtn" data-i18n="popupConfigBtn">Configuration (Clé API & Règles)</button>
  <div id="status"></div>
  <script src="popup.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
